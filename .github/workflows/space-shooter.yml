name: Update Space Shooter Game

on:
  schedule:
    - cron: '0 0 * * *' # Updates daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger anytime

permissions:
  contents: write         # Allows the bot to commit game.gif to your repo

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2   # Required to update cleanly without repository bloat

      - uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'game.gif'
          strategy: 'random'
